name: Dallas report validation

on:
  push:
    branches:
      - integration/dallas-market-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl xlrd lxml

      - name: Run DallasNow report validation
        run: python tools/dallas_report_validation.py

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dallas-report-validation
          path: dallas-report-validation/
          if-no-files-found: warn
