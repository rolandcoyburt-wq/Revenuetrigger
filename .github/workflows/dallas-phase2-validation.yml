name: Dallas Phase 2 validation

on:
  push:
    branches:
      - integration/dallas-market-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Dallas integration tests
        run: node backend/tests/dallas-integration.test.mjs

      - name: Fort Worth regression tests
        run: node backend/tests/fort-worth-integration.test.mjs

      - name: Stored feed regression tests
        run: node backend/tests/feed-readonly.test.mjs

      - name: Live Dallas adapter metrics
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {fetchDallasNowBuildingRecords} from './backend/markets/dfw/dallas-now.js';
          const workerUrl=new URL('./backend/worker.js',import.meta.url);
          const src=await readFile(workerUrl,'utf8');
          const testSource=src.replace(/from '(\.\/[^']+)'/g,(_,p)=>`from '${new URL(p,workerUrl).href}'`)
            +'\nexport {fetchMarket};';
          const core=await import('data:text/javascript;base64,'+Buffer.from(testSource).toString('base64'));
          const records=await fetchDallasNowBuildingRecords({days:7});
          const meta=records._meta||{};
          const valuation=records.filter(x=>Number(x.valuation)>0).length;
          const company=records.filter(x=>String(x.companyCandidate||'').trim()).length;
          const leads=await core.fetchMarket('Dallas',7,500);
          const output={
            adapter:{
              count:records.length,
              submittedCount:meta.submittedCount,
              issuedCount:meta.issuedCount,
              exactOverlapCount:meta.exactOverlapCount,
              temporaryIdCount:meta.temporaryIdCount,
              valuationPopulationPct:Number((100*valuation/Math.max(1,records.length)).toFixed(2)),
              companyPopulationPct:Number((100*company/Math.max(1,records.length)).toFixed(2))
            },
            reports:records._reports,
            normalizedSamples:{
              submitted:records.filter(x=>x.sourceObservations?.some(o=>o.report==='submitted')).slice(0,2).map(x=>({
                sourceRecordId:x.sourceRecordId,recordType:x.recordType,status:x.statusRaw,fileDate:x.fileDate,eventDate:x.eventDate,
                address:x.address?.display,valuation:x.valuation,companyCandidate:x.companyCandidate,temporaryId:x.temporaryId,
                sourceUrl:x.sourceUrl,observations:x.sourceObservations.map(o=>o.report)
              })),
              issued:records.filter(x=>x.sourceObservations?.some(o=>o.report==='issued')).slice(0,2).map(x=>({
                sourceRecordId:x.sourceRecordId,recordType:x.recordType,status:x.statusRaw,fileDate:x.fileDate,statusDate:x.statusDate,eventDate:x.eventDate,
                address:x.address?.display,valuation:x.valuation,companyCandidate:x.companyCandidate,temporaryId:x.temporaryId,
                sourceUrl:x.sourceUrl,observations:x.sourceObservations.map(o=>o.report)
              }))
            },
            scoredSamples:leads.slice(0,5).map(x=>({id:x.id,permit:x.permit,score:x.score,temperature:x.temperature,company:x.company,address:x.address,source:x.source,temporaryId:x.temporaryId}))
          };
          console.log('DALLAS_PHASE2_LIVE_BEGIN');
          console.log(JSON.stringify(output,null,2));
          console.log('DALLAS_PHASE2_LIVE_END');
          NODE

      - name: Seed genuine Dallas and Fort Worth records into local D1
        run: |
          cat >/tmp/leads-schema.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS leads (
            id TEXT PRIMARY KEY,
            name TEXT NOT NULL,
            address TEXT,
            event_date TEXT,
            company TEXT,
            scope TEXT,
            score INTEGER NOT NULL,
            categories TEXT NOT NULL,
            value INTEGER NOT NULL,
            temperature TEXT,
            permit TEXT,
            source TEXT,
            updated_at TEXT NOT NULL DEFAULT (datetime('now')),
            market TEXT NOT NULL DEFAULT 'Phoenix',
            permit_status TEXT,
            official_value REAL
          );
          CREATE INDEX IF NOT EXISTS idx_leads_market_event ON leads(market,event_date DESC);
          SQL
          npx wrangler d1 execute signalhound --local --config backend/wrangler.toml --file=/tmp/leads-schema.sql

          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const workerUrl=new URL('./backend/worker.js',import.meta.url);
          const src=await readFile(workerUrl,'utf8');
          const testSource=src.replace(/from '(\.\/[^']+)'/g,(_,p)=>`from '${new URL(p,workerUrl).href}'`)
            +'\nexport {fetchMarket};';
          const core=await import('data:text/javascript;base64,'+Buffer.from(testSource).toString('base64'));
          const [dallas,fortWorth]=await Promise.all([core.fetchMarket('Dallas',7,80),core.fetchMarket('Fort Worth',7,5)]);
          const rows=[...dallas.slice(0,80),...fortWorth.slice(0,5)];
          const q=v=>v===null||v===undefined?'NULL':"'" + String(v).replaceAll("'","''") + "'";
          const sql=rows.map(x=>`INSERT OR REPLACE INTO leads
            (id,name,address,event_date,company,scope,score,categories,value,temperature,permit,permit_status,official_value,source,market,updated_at)
            VALUES (${[
              x.id,x.name,x.address,new Date(x.date).toISOString(),x.company,x.scope,Number(x.score||0),
              JSON.stringify(x.categories||[]),Number(x.value||0),x.temperature,x.permit,x.permitStatus||'—',
              x.officialPermitValue??null,x.source,x.market,new Date().toISOString()
            ].map(q).join(',')});`).join('\n');
          await writeFile('/tmp/genuine-dfw.sql',sql);
          console.log(JSON.stringify({dallasSeed:dallas.slice(0,80).length,fortWorthSeed:fortWorth.slice(0,5).length}));
          NODE
          npx wrangler d1 execute signalhound --local --config backend/wrangler.toml --file=/tmp/genuine-dfw.sql
          npx wrangler d1 execute signalhound --local --config backend/wrangler.toml --command="SELECT market, COUNT(*) AS n FROM leads GROUP BY market ORDER BY market;"

      - name: Exercise Worker against local D1 stored feed
        run: |
          npx wrangler dev --config backend/wrangler.toml --port 8787 --local >/tmp/wrangler.log 2>&1 &
          echo $! >/tmp/wrangler.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/sources >/tmp/sources.json; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8787/api/feed?markets=Dallas&days=7&limit=20' >/tmp/dallas-feed.json
          curl -fsS 'http://127.0.0.1:8787/api/feed?markets=Dallas,Fort%20Worth&days=7&limit=20' >/tmp/mixed-feed.json
          curl -fsS 'http://127.0.0.1:8787/api/leads?markets=Dallas&days=7&limit=20' >/tmp/dallas-leads.json
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const read=async p=>JSON.parse(await readFile(p,'utf8'));
          const sources=await read('/tmp/sources.json'),dallas=await read('/tmp/dallas-feed.json'),mixed=await read('/tmp/mixed-feed.json'),leads=await read('/tmp/dallas-leads.json');
          if(sources.markets?.Dallas?.status!=='live')throw new Error('Dallas not live in /api/sources');
          if(!dallas.leads?.length||dallas.leads.some(x=>x.market!=='Dallas'))throw new Error('Dallas stored feed invalid');
          if(!mixed.leads?.some(x=>x.market==='Dallas')||!mixed.leads?.some(x=>x.market==='Fort Worth'))throw new Error('Mixed DFW stored feed invalid');
          if(leads.liveDirect!==true||!leads.leads?.length||leads.leads.some(x=>x.market!=='Dallas'))throw new Error('Dallas live /api/leads invalid');
          console.log('DALLAS_D1_VALIDATION_BEGIN');
          console.log(JSON.stringify({
            sourcesDallas:sources.markets.Dallas,
            storedDallas:{state:dallas.state,count:dallas.leads.length,markets:dallas.markets,sample:dallas.leads.slice(0,3).map(x=>({id:x.id,permit:x.permit,market:x.market,score:x.score,company:x.company,address:x.address,source:x.source}))},
            mixed:{state:mixed.state,count:mixed.leads.length,markets:mixed.markets,marketCounts:Object.fromEntries([...new Set(mixed.leads.map(x=>x.market))].map(m=>[m,mixed.leads.filter(x=>x.market===m).length]))},
            directDallas:{liveDirect:leads.liveDirect,count:leads.leads.length,sample:leads.leads.slice(0,2).map(x=>({id:x.id,permit:x.permit,score:x.score,temporaryId:x.temporaryId}))}
          },null,2));
          console.log('DALLAS_D1_VALIDATION_END');
          NODE
          kill $(cat /tmp/wrangler.pid) || true
