name: Dallas Phase 2 validation

on:
  push:
    branches:
      - integration/dallas-market-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dallas integration tests
        run: node backend/tests/dallas-integration.test.mjs
      - name: Fort Worth regression tests
        run: node backend/tests/fort-worth-integration.test.mjs
      - name: Stored feed regression tests
        run: node backend/tests/feed-readonly.test.mjs
      - name: Live Dallas adapter metrics
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {fetchDallasNowBuildingRecords} from './backend/markets/dfw/dallas-now.js';
          import {toLeadInput} from './backend/markets/dfw/normalize.js';
          const workerUrl=new URL('./backend/worker.js',import.meta.url);
          const src=await readFile(workerUrl,'utf8');
          const testSource=src.replace(/from '(\.\/[^']+)'/g,(_,p)=>`from '${new URL(p,workerUrl).href}'`)
            +'\nexport {fetchMarket};';
          const core=await import('data:text/javascript;base64,'+Buffer.from(testSource).toString('base64'));
          const records=await fetchDallasNowBuildingRecords({days:7});
          const meta=records._meta||{};
          const valuation=records.filter(x=>Number(x.valuation)>0).length;
          const company=records.filter(x=>String(x.companyCandidate||'').trim()).length;
          const temp=records.filter(x=>x.temporaryId).length;
          const leads=await core.fetchMarket('Dallas',7,500);
          const output={
            adapter:{
              count:records.length,
              submittedCount:meta.submittedCount,
              issuedCount:meta.issuedCount,
              exactOverlapCount:meta.exactOverlapCount,
              temporaryIdCount:temp,
              valuationPopulationPct:Number((100*valuation/Math.max(1,records.length)).toFixed(2)),
              companyPopulationPct:Number((100*company/Math.max(1,records.length)).toFixed(2))
            },
            reports:records._reports,
            normalizedSamples:{
              submitted:records.filter(x=>x.sourceObservations?.some(o=>o.report==='submitted')).slice(0,2).map(x=>({
                sourceRecordId:x.sourceRecordId,recordType:x.recordType,status:x.statusRaw,fileDate:x.fileDate,eventDate:x.eventDate,
                address:x.address?.display,valuation:x.valuation,companyCandidate:x.companyCandidate,temporaryId:x.temporaryId,
                sourceUrl:x.sourceUrl,observations:x.sourceObservations.map(o=>o.report)
              })),
              issued:records.filter(x=>x.sourceObservations?.some(o=>o.report==='issued')).slice(0,2).map(x=>({
                sourceRecordId:x.sourceRecordId,recordType:x.recordType,status:x.statusRaw,fileDate:x.fileDate,statusDate:x.statusDate,eventDate:x.eventDate,
                address:x.address?.display,valuation:x.valuation,companyCandidate:x.companyCandidate,temporaryId:x.temporaryId,
                sourceUrl:x.sourceUrl,observations:x.sourceObservations.map(o=>o.report)
              }))
            },
            scoredSamples:leads.slice(0,5).map(x=>({id:x.id,permit:x.permit,score:x.score,temperature:x.temperature,company:x.company,address:x.address,source:x.source,temporaryId:x.temporaryId}))
          };
          console.log('DALLAS_PHASE2_LIVE_BEGIN');
          console.log(JSON.stringify(output,null,2));
          console.log('DALLAS_PHASE2_LIVE_END');
          NODE
