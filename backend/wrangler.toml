name = "signalhound-api"
main = "worker.js"
compatibility_date = "2026-09-01"

# IMPORTANT: paste the SAME D1 database_id already used by your working V1 Worker.
[[d1_databases]]
binding = "DB"
database_name = "signalhound"
database_id = "5b0156dc-1646-4233-abf7-5d65ef30a317"

[vars]
ALLOWED_ORIGIN = "https://revenuetrigger.ai"
FRONTEND_URL = "https://revenuetrigger.ai"
DEV_AUTH_BYPASS = "false"

# Use an address on a domain you verify with Resend.
EMAIL_FROM = "RevenueTrigger <alerts@mail.revenuetrigger.ai>"

# Stripe recurring Price IDs. These are not secret keys.
STRIPE_PRICE_SCOUT = "price_1UIfIzQtkZRdtmROP8dRxslu"
STRIPE_PRICE_HUNTER = "price_1UIfJiQtkZRdtmROREXUa7Ad"
STRIPE_PRICE_TERRITORY = "price_1UIfKRQtkZRdtmROuFOtSulQ"

[triggers]
crons = ["17 * * * *"]

[previews.vars]
ALLOWED_ORIGIN = "https://redesign-signal-command-v7-signalhound-phoenix.rolandcoyburt.workers.dev"
FRONTEND_URL = "https://redesign-signal-command-v7-signalhound-phoenix.rolandcoyburt.workers.dev"
DEV_AUTH_BYPASS = "false"

# Empty sender disables email delivery in the preview.
EMAIL_FROM = "RevenueTrigger Preview <onboarding@resend.dev>"

# The existing checkout guard rejects REPLACE_ values before calling Stripe.
STRIPE_PRICE_SCOUT = "REPLACE_PREVIEW_SCOUT"
STRIPE_PRICE_HUNTER = "REPLACE_PREVIEW_HUNTER"
STRIPE_PRICE_TERRITORY = "REPLACE_PREVIEW_TERRITORY"

[[previews.d1_databases]]
binding = "DB"
database_name = "revenuetrigger-preview"
database_id = "3e002252-2664-496f-a77f-a3a9880274d8"
